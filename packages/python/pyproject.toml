[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trappsec"
version = "0.2.0"
authors = [
  { name="Nikhil Salgaonkar", email="nikhil@ftfy.co" },
]
description = "deception as a developer tool"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["security", "deception", "honeypot", "honey fields", "decoy", "api security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
    "Framework :: FastAPI",
    "Framework :: Flask",
    "Framework :: Django",
    "Framework :: Tornado",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://trappsec.dev"
"Repository" = "https://github.com/trappsec-dev/trappsec"
"Bug Tracker" = "https://github.com/trappsec-dev/trappsec/issues"

[project.optional-dependencies]
webhooks = ["requests"]
otel = ["opentelemetry-api"]
test = [
    "pytest",
    "requests",
    "opentelemetry-sdk",
    "flask",
    "flask-wtf",
    "fastapi",
    "httpx",
    "python-multipart",
    "starlette",
    "django",
    "sanic",
    "sanic-testing",
    "tornado",
    "litestar",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trappsec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
