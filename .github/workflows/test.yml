name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Syntax errors and undefined names only, so this stays green on style.
      - name: Ruff (syntax errors only)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 packages/python tests/e2e examples
      - name: Node syntax check
        run: |
          find packages/node/src -name '*.js' -print0 | xargs -0 -n1 node --check

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/python[test,webhooks,otel]"
          # Explicit list so the job also works if an extra is missing from pyproject.
          pip install pytest flask fastapi httpx starlette django sanic sanic-testing tornado litestar opentelemetry-sdk requests
      - name: Run tests
        run: pytest packages/python/tests

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            packages/node/package-lock.json
            packages/node/test/integrations/package.json
      - name: Core tests
        working-directory: packages/node
        run: |
          npm ci
          npm test
      - name: Integration tests
        working-directory: packages/node/test/integrations
        run: |
          npm install
          node --test

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [packages/go, packages/go/nethttp, packages/go/gin, packages/go/echo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            packages/go/*/go.sum
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test (race)
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  go-examples:
    name: Build Go examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            packages/go/*/go.sum
            examples/go-*/go.sum
      - name: Build
        run: |
          for d in examples/go-*/; do
            echo "== $d"
            (cd "$d" && go build ./...)
          done

  e2e:
    name: End-to-end examples
    runs-on: ubuntu-latest
    needs: [python, node, go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            packages/go/*/go.sum
            examples/go-*/go.sum
      - uses: astral-sh/setup-uv@v5
      - name: Install e2e test dependencies
        run: pip install pytest requests
      - name: Run examples
        run: python tests/e2e/run_examples.py --install --log-dir artifacts/e2e-logs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: artifacts/e2e-logs/
          if-no-files-found: ignore
