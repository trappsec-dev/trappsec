name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # Syntax errors and undefined names only, so this stays green on style.
      - name: Ruff (syntax errors only)
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 packages/python tests/e2e tests/package examples
      - name: Node syntax check
        run: |
          find packages/node/src -name '*.js' -print0 | xargs -0 -n1 node --check

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/python[test,webhooks,otel]"
          # Explicit list so the job also works if an extra is missing from pyproject.
          pip install pytest flask fastapi httpx python-multipart starlette django sanic sanic-testing tornado litestar opentelemetry-sdk requests
      - name: Run tests
        run: pytest packages/python/tests

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            packages/node/package-lock.json
            packages/node/test/integrations/package-lock.json
      - name: Core tests
        working-directory: packages/node
        run: |
          npm ci
          npm test
      - name: Integration tests
        working-directory: packages/node/test/integrations
        run: |
          npm ci
          node --test

  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [packages/go, packages/go/nethttp, packages/go/gin, packages/go/echo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            packages/go/*/go.sum
      - name: Vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      - name: Test (race)
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  # Oldest framework versions we support (docs/supported-frameworks.md), each
  # in its own environment on the oldest supported Python. Test-only tools are
  # pinned to versions those releases work with (old TestClients need
  # httpx<0.28; Flask 2.0 needs Werkzeug 2.0).
  python-minimum:
    name: Python minimum (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: flask, module: flask, test: test_integration_flask.py, deps: "flask==2.0.* werkzeug<2.1" }
          - { name: fastapi, module: fastapi, test: test_integration_fastapi.py, deps: "fastapi==0.95.* httpx<0.28 python-multipart" }
          - { name: starlette, module: starlette, test: test_integration_starlette.py, deps: "starlette==0.24.* httpx<0.28 python-multipart" }
          - { name: litestar, module: litestar, test: test_integration_litestar.py, deps: "litestar==2.13.* httpx<0.28 sniffio" }
          - { name: django, module: django, test: test_integration_django.py, deps: "django==3.2.* werkzeug" }
          - { name: sanic, module: sanic, test: test_integration_sanic.py, deps: "sanic==24.6.* sanic-testing==24.6.*" }
          - { name: tornado, module: tornado, test: test_integration_tornado.py, deps: "tornado==6.0.*" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Install ${{ matrix.name }} at its minimum version
        env:
          DEPS: ${{ matrix.deps }}  # via env: specs like httpx<0.28 must not reach the shell parser
        run: |
          set -f  # no globbing of ==2.0.*
          pip install pytest requests $DEPS
      - name: Run ${{ matrix.test }}
        env:
          PYTHONPATH: packages/python/src
        run: |
          python -c "import importlib.metadata as md, ${{ matrix.module }}; print('${{ matrix.module }}', md.version('${{ matrix.module }}'))"
          pytest -rs packages/python/tests/${{ matrix.test }}

  node-minimum:
    name: Node minimum framework versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integration tests against the oldest supported framework versions
        working-directory: packages/node/test/integrations
        run: |
          npm ci
          # --legacy-peer-deps: the test-only plugins' peer ranges follow the latest majors
          npm install --no-save --no-audit --no-fund --legacy-peer-deps \
            "express4@npm:express@4.17" "express@5.0" "fastify@4" "@fastify/multipart@8" \
            "koa@2.13" "@koa/router@10" "koa-bodyparser@4" "@hapi/hapi@20" \
            "@nestjs/common@10" "@nestjs/core@10" "@nestjs/platform-express@10" "@nestjs/platform-fastify@10"
          node -e "for (const p of ['express4','express','fastify','koa','@koa/router','@hapi/hapi','@nestjs/core']) console.log(p, require(p + '/package.json').version)"
          node --test

  package:
    name: Package smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Builds the wheel, sdist and npm tarball, installs each into a clean
      # environment outside the repo and runs a real framework app against it.
      - name: Build, install and smoke-test distributions
        run: bash tests/package/run.sh

  go-examples:
    name: Build Go examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            packages/go/*/go.sum
            examples/go-*/go.sum
      - name: Build
        run: |
          for d in examples/go-*/; do
            echo "== $d"
            (cd "$d" && go build ./...)
          done

  e2e:
    name: End-to-end examples
    runs-on: ubuntu-latest
    needs: [python, node, go]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/go/go.mod
          cache-dependency-path: |
            packages/go/go.sum
            packages/go/*/go.sum
            examples/go-*/go.sum
      - uses: astral-sh/setup-uv@v5
      - name: Install e2e test dependencies
        run: pip install pytest requests
      - name: Run examples
        run: python tests/e2e/run_examples.py --install --log-dir artifacts/e2e-logs
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: artifacts/e2e-logs/
          if-no-files-found: ignore
