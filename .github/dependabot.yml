# Version-update PRs are disabled (open-pull-requests-limit: 0) while keeping
# the per-ecosystem config, so it can be re-enabled by removing that line.
# Dependabot security updates are controlled separately in the repository
# settings (Settings > Advanced Security), not by this file.
#
# examples/ is intentionally not listed: example apps are not published and
# their dependencies are not managed by Dependabot.
version: 2
updates:
  - package-ecosystem: pip
    directory: /packages/python
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/node
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /packages/node/test/integrations
    open-pull-requests-limit: 0
    schedule:
      interval: monthly
    groups:
      test-frameworks:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /packages/go
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /packages/go/nethttp
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /packages/go/gin
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: /packages/go/echo
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
